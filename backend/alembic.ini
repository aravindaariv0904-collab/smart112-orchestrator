[alembic]
# %(here)s keeps the script location stable regardless of the invocation directory
# (previously `alembic -c backend/alembic.ini` looked for ./alembic and failed).
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
version_path_separator = os
# Overridden at runtime by backend/alembic/env.py from DATABASE_URL/settings.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/smart112

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
