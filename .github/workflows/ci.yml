name: SMART 112 CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-validation:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JSON Schema Validator
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema check-jsonschema

      - name: Validate Contract Schemas
        run: |
          check-jsonschema --check-metaschema contracts/*.schema.json

  backend-lint-and-test:
    name: Backend Tests with PostgreSQL & PostGIS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart112
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart112
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint Python Code with Ruff
        run: |
          ruff check . --ignore E501 || true

      - name: Run Alembic Database Migrations on PostGIS
        run: |
          alembic upgrade head

      - name: Execute Pytest Suite (Spatial, Rules, Locks, Hardening)
        run: |
          pytest backend/tests/ -v

  frontend-lint-and-build:
    name: Frontend TypeScript Compilation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Vite TypeScript & Build Static Assets
        working-directory: frontend
        run: |
          npm run build
